# Deploys the `web` artifact to an Azure Static Web App using a Workload-Identity-Federated
# service connection (no stored secrets). Runs as a deployment job so environment approvals apply.
parameters:
  - name: environment
    type: string
  - name: swaName
    type: string
  - name: serviceConnection
    type: string
  - name: resourceGroup
    type: string

jobs:
  - deployment: deploy_${{ parameters.environment }}
    displayName: Deploy to ${{ parameters.environment }}
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
            - download: current
              artifact: web

            - task: AzureCLI@2
              displayName: Fetch SWA deployment token
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -e
                  TOKEN=$(az staticwebapp secrets list \
                    --name "${{ parameters.swaName }}" \
                    --resource-group "${{ parameters.resourceGroup }}" \
                    --query properties.apiKey -o tsv)
                  echo "##vso[task.setvariable variable=SWA_TOKEN;issecret=true]$TOKEN"

            - task: AzureStaticWebApp@0
              displayName: Deploy static assets
              inputs:
                workingDirectory: $(Pipeline.Workspace)/web
                app_location: /
                skip_app_build: true
                skip_api_build: true
                azure_static_web_apps_api_token: $(SWA_TOKEN)

            - script: |
                set -e
                URL=$(az staticwebapp show --name "${{ parameters.swaName }}" --resource-group "${{ parameters.resourceGroup }}" --query defaultHostname -o tsv 2>/dev/null || true)
                if [ -n "$URL" ]; then
                  echo "Smoke testing https://$URL"
                  curl -fsS --retry 5 --retry-delay 5 "https://$URL/build-info.txt"
                fi
              displayName: Smoke test
              continueOnError: true
