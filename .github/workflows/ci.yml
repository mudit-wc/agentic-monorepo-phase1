name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: true # flip to false + add NX_CLOUD_ACCESS_TOKEN secret to enable remote caching

jobs:
  validate:
    name: Lint · Test · Build (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required for nx affected

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Derive affected SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - name: Validate commit messages (PR only)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Check formatting
        run: npx nx format:check

      - name: Lint · Test · Build
        run: npx nx affected -t lint test build --configuration=ci --parallel=3

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: E2E (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run affected e2e
        run: npx nx affected -t e2e --parallel=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/
          retention-days: 7
          if-no-files-found: ignore

  pr-hygiene:
    name: PR hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require AB# work item reference
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! printf '%s\n%s\n%s' "$TITLE" "$BODY" "$BRANCH" | grep -Eq 'AB#[0-9]+'; then
            echo "::error::PR must reference an Azure Boards work item as AB#<id> in the title, body, or branch name."
            exit 1
          fi

      - name: Warn on large diff
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          TOTAL=$((ADDITIONS + DELETIONS))
          if [ "$TOTAL" -gt 400 ]; then
            echo "::warning::PR changes $TOTAL lines (> 400). Consider splitting."
          fi
